<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>INFRALOG 2026</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f6f8;
      padding: 20px;
    }

    .contenedor {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
    }

    #lectorQR {
      width: 100%;
      max-width: 400px;
      margin: 20px auto;
    }

    #resultado {
      margin-top: 20px;
      font-size: 18px;
    }

    button {
      padding: 15px;
      width: 100%;
      margin-top: 15px;
      font-size: 18px;
    }

  </style>

</head>


<body>

<div class="contenedor">

  <h1>INFRALOG 2026</h1>

  <h2>Registro de asistentes</h2>

  <p>
    Apunte la cámara hacia el código QR
  </p>


  <div id="lectorQR"></div>


  <div id="resultado">
    📷 Esperando código QR...
  </div>


  <button onclick="reiniciarEscaner()">
    📷 Escanear otro QR
  </button>

</div>


<script>


// =================================================
// URL DE APPS SCRIPT
// =================================================

const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbzUz3S11j8Efrm1_3uN0KjifOCN96NbXt4Rn6ZKe0wqF4kmkvpje0vT4hhMjTMVjkpu/exec";


// =================================================
// INICIAR LECTOR
// =================================================

let lectorQR;


function iniciarEscaner() {

  lectorQR =
    new Html5Qrcode("lectorQR");


  lectorQR.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },


    function(codigo) {

      console.log(
        "QR detectado:",
        codigo
      );


      lectorQR.stop().then(function() {

        registrarAsistencia(codigo);

      });

    },


    function(error) {

      // No hacemos nada mientras busca QR.

    }

  )

  .catch(function(error) {

    document.getElementById("resultado").innerHTML =
      "<p style='color:red'>❌ No se pudo acceder a la cámara.</p>";

  });

}


// =================================================
// REGISTRAR ASISTENCIA
// =================================================

function registrarAsistencia(id) {


  document.getElementById("resultado").innerHTML = `

    <h2>🔍 Código detectado</h2>

    <h3>${id}</h3>

    <p>⏳ Registrando asistencia...</p>

  `;


  // Creamos un formulario invisible.
  // Esto evita el problema de comunicación
  // directa entre GitHub y Apps Script.

  const formulario =
    document.createElement("form");


  formulario.method = "GET";

  formulario.action =
    URL_APPS_SCRIPT;


  formulario.target =
    "_blank";


  const campo =
    document.createElement("input");


  campo.type = "hidden";

  campo.name = "id";

  campo.value = id;


  formulario.appendChild(campo);

  document.body.appendChild(formulario);


  formulario.submit();

}


// =================================================
// REINICIAR
// =================================================

function reiniciarEscaner() {

  location.reload();

}


// =================================================
// INICIAR
// =================================================

window.onload = function() {

  iniciarEscaner();

};

</script>


</body>

</html>
