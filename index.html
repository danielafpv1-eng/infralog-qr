<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>INFRALOG 2026</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f6f8;
      text-align: center;
    }

    .contenedor {
      max-width: 500px;
      margin: 20px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    #lectorQR {
      width: 100%;
      max-width: 400px;
      margin: 20px auto;
    }

    #resultado {
      margin-top: 20px;
    }

    .exito {
      padding: 20px;
      border: 2px solid green;
      border-radius: 12px;
      margin-top: 20px;
    }

    .alerta {
      padding: 20px;
      border: 2px solid orange;
      border-radius: 12px;
      margin-top: 20px;
    }

    .error {
      padding: 20px;
      border: 2px solid red;
      border-radius: 12px;
      margin-top: 20px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
    }

  </style>

</head>


<body>

<div class="contenedor">

  <h1>INFRALOG 2026</h1>

  <h2>Registro de asistentes</h2>

  <p>
    Apunte la cámara hacia el código QR
  </p>


  <div id="lectorQR"></div>


  <div id="resultado">
    📷 Esperando código QR...
  </div>


  <button onclick="reiniciarEscaner()">
    📷 Escanear otro QR
  </button>

</div>


<script>


// ==========================================
// URL APPS SCRIPT
// ==========================================

const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbzUz3S11j8Efrm1_3uN0KjifOCN96NbXt4Rn6ZKe0wqF4kmkvpje0vT4hhMjTMVjkpu/exec";


// ==========================================
// LECTOR
// ==========================================

let lectorQR = null;


// ==========================================
// INICIAR
// ==========================================

function iniciarEscaner() {

  lectorQR =
    new Html5Qrcode("lectorQR");


  lectorQR.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },


    function(codigo) {

      console.log(
        "QR detectado:",
        codigo
      );


      lectorQR.stop()
        .then(function() {

          consultarInvitado(codigo);

        })
        .catch(function() {

          consultarInvitado(codigo);

        });

    },


    function(error) {

      // Ignorar errores normales del escaneo

    }

  )

  .catch(function(error) {

    console.error(error);

    document.getElementById("resultado").innerHTML = `

      <div class="error">

        ❌ No se pudo acceder a la cámara.

      </div>

    `;

  });

}


// ==========================================
// CONSULTAR APPS SCRIPT
// ==========================================

function consultarInvitado(id) {


  const callback =
    "respuesta_" + Date.now();


  document.getElementById("resultado").innerHTML = `

    <h2>🔍 Código detectado</h2>

    <h3>${id}</h3>

    <p>⏳ Consultando registro...</p>

  `;


  // ==========================================
  // CREAR FUNCIÓN GLOBAL
  // ==========================================

  window[callback] = function(datos) {

    console.log(
      "RESPUESTA:",
      datos
    );


    // ========================================
    // NO ENCONTRADO
    // ========================================

    if (
      datos.mensaje === "NO_ENCONTRADO"
    ) {

      document.getElementById("resultado").innerHTML = `

        <div class="error">

          <h2>❌ Invitado no encontrado</h2>

          <p>
            Código: <b>${id}</b>
          </p>

        </div>

      `;

      limpiarCallback(callback);

      return;

    }


    // ========================================
    // ERROR
    // ========================================

    if (
      datos.mensaje === "ERROR"
    ) {

      document.getElementById("resultado").innerHTML = `

        <div class="error">

          <h2>❌ Error</h2>

          <p>
            ${datos.error}
          </p>

        </div>

      `;

      limpiarCallback(callback);

      return;

    }


    // ========================================
    // YA REGISTRADO
    // ========================================

    if (
      datos.mensaje === "YA_REGISTRADO"
    ) {

      document.getElementById("resultado").innerHTML = `

        <div class="alerta">

          <h2>⚠️ YA REGISTRADO</h2>

          <h3>
            ${datos.nombre}
            ${datos.apellido}
          </h3>

          <p>
            <b>Empresa:</b>
            ${datos.empresa}
          </p>

          <p>
            Este invitado ya registró su ingreso.
          </p>

        </div>

      `;

      limpiarCallback(callback);

      return;

    }


    // ========================================
    // REGISTRADO
    // ========================================

    if (
      datos.mensaje === "REGISTRADO"
    ) {

      document.getElementById("resultado").innerHTML = `

        <div class="exito">

          <h2>✅ REGISTRO EXITOSO</h2>

          <h3>
            ${datos.nombre}
            ${datos.apellido}
          </h3>

          <p>
            <b>Cargo:</b>
            ${datos.cargo}
          </p>

          <p>
            <b>Empresa:</b>
            ${datos.empresa}
          </p>

          <p>
            <b>Hora:</b>
            ${formatearFecha(datos.horaIngreso)}
          </p>

        </div>

      `;

      limpiarCallback(callback);

      return;

    }

  };


  // ==========================================
  // CREAR SCRIPT JSONP
  // ==========================================

  const script =
    document.createElement("script");


  script.id =
    callback;


  script.src =
    URL_APPS_SCRIPT +
    "?id=" +
    encodeURIComponent(id) +
    "&callback=" +
    callback;


  script.onerror = function() {

    document.getElementById("resultado").innerHTML = `

      <div class="error">

        <h2>❌ Error de conexión</h2>

        <p>
          No se pudo comunicar con Apps Script.
        </p>

      </div>

    `;

    limpiarCallback(callback);

  };


  document.body.appendChild(script);


  // ==========================================
  // TIEMPO MÁXIMO DE ESPERA
  // ==========================================

  setTimeout(function() {

    if (
      typeof window[callback] === "function"
    ) {

      document.getElementById("resultado").innerHTML = `

        <div class="error">

          <h2>❌ Tiempo agotado</h2>

          <p>
            Apps Script no respondió.
          </p>

        </div>

      `;

      limpiarCallback(callback);

    }

  }, 10000);

}


// ==========================================
// LIMPIAR CALLBACK
// ==========================================

function limpiarCallback(callback) {

  try {

    delete window[callback];

  } catch (e) {

    window[callback] = undefined;

  }


  const script =
    document.getElementById(callback);


  if (script) {
    script.remove();
  }

}


// ==========================================
// FECHA
// ==========================================

function formatearFecha(fecha) {

  if (!fecha) {
    return "";
  }


  const f =
    new Date(fecha);


  if (isNaN(f)) {
    return fecha;
  }


  return f.toLocaleString(
    "es-PE"
  );

}


// ==========================================
// REINICIAR
// ==========================================

function reiniciarEscaner() {

  location.reload();

}


// ==========================================
// ARRANCAR
// ==========================================

window.onload = function() {

  iniciarEscaner();

};

</script>

</body>

</html>
