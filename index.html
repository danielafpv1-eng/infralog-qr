<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>INFRALOG 2026 - Registro</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f6f8;
      text-align: center;
    }

    .contenedor {
      max-width: 500px;
      margin: 20px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 5px;
    }

    h2 {
      margin-top: 5px;
    }

    #lectorQR {
      width: 100%;
      max-width: 400px;
      margin: 20px auto;
    }

    #resultado {
      margin-top: 20px;
      font-size: 18px;
    }

    .exito {
      padding: 20px;
      border: 2px solid green;
      border-radius: 12px;
      margin-top: 20px;
    }

    .alerta {
      padding: 20px;
      border: 2px solid orange;
      border-radius: 12px;
      margin-top: 20px;
    }

    .error {
      padding: 20px;
      border: 2px solid red;
      border-radius: 12px;
      margin-top: 20px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #222;
      color: white;
    }

  </style>

</head>


<body>

  <div class="contenedor">

    <h1>INFRALOG 2026</h1>

    <h2>Registro de asistentes</h2>

    <p>
      Apunte la cámara hacia el código QR
    </p>


    <!-- LECTOR QR -->

    <div id="lectorQR"></div>


    <!-- RESULTADO -->

    <div id="resultado">
      📷 Esperando código QR...
    </div>


    <button onclick="reiniciarEscaner()">
      📷 Escanear otro QR
    </button>

  </div>


<script>


// ==================================================
// URL DE GOOGLE APPS SCRIPT
// ==================================================

const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbzUz3S11j8Efrm1_3uN0KjifOCN96NbXt4Rn6ZKe0wqF4kmkvpje0vT4hhMjTMVjkpu/exec";


// ==================================================
// VARIABLE DEL LECTOR
// ==================================================

let lectorQR = null;


// ==================================================
// INICIAR ESCÁNER
// ==================================================

function iniciarEscaner() {

  document.getElementById("resultado").innerHTML =
    "📷 Buscando código QR...";


  lectorQR = new Html5Qrcode("lectorQR");


  const configuracion = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    }

  };


  lectorQR.start(

    {
      facingMode: "environment"
    },

    configuracion,


    function(codigoEscaneado) {

      console.log(
        "Código detectado:",
        codigoEscaneado
      );


      lectorQR.stop().then(function() {

        consultarAppsScript(codigoEscaneado);

      });

    },


    function(error) {

      // Errores normales mientras busca el QR.
      // No mostramos nada.

    }

  )

  .catch(function(error) {

    console.error(error);

    document.getElementById("resultado").innerHTML = `

      <div class="error">

        ❌ No se pudo acceder a la cámara.

        <br><br>

        Verifique los permisos del navegador.

      </div>

    `;

  });

}


// ==================================================
// CONSULTAR GOOGLE APPS SCRIPT
// ==================================================

function consultarAppsScript(id) {


  const nombreCallback =
    "respuesta_" + Date.now();


  // Mostrar que ya detectamos el QR

  document.getElementById("resultado").innerHTML = `

    <div>

      <h2>🔍 Código detectado</h2>

      <h3>${id}</h3>

      <p>⏳ Consultando registro...</p>

    </div>

  `;


  // ================================================
  // FUNCIÓN QUE RECIBIRÁ LA RESPUESTA
  // ================================================

  window[nombreCallback] = function(datos) {


    console.log(
      "Respuesta Apps Script:",
      datos
    );


    // Eliminar función temporal

    try {
      delete window[nombreCallback];
    } catch (e) {
      window[nombreCallback] = undefined;
    }


    // ==========================================
    // INVITADO NO ENCONTRADO
    // ==========================================

    if (
      datos.mensaje === "NO_ENCONTRADO"
    ) {

      document.getElementById("resultado").innerHTML = `

        <div class="error">

          <h2>
            ❌ Invitado no encontrado
          </h2>

          <p>
            Código: <b>${id}</b>
          </p>

        </div>

      `;

      return;

    }


    // ==========================================
    // ERROR
    // ==========================================

    if (
      datos.mensaje === "ERROR"
    ) {

      document.getElementById("resultado").innerHTML = `

        <div class="error">

          <h2>❌ Error</h2>

          <p>
            ${datos.error}
          </p>

        </div>

      `;

      return;

    }


    // ==========================================
    // YA REGISTRADO
    // ==========================================

    if (
      datos.mensaje === "YA_REGISTRADO"
    ) {

      document.getElementById("resultado").innerHTML = `

        <div class="alerta">

          <h2>
            ⚠️ YA REGISTRADO
          </h2>

          <h3>
            ${datos.nombre}
            ${datos.apellido}
          </h3>

          <p>
            <b>Empresa:</b>
            ${datos.empresa}
          </p>

          <p>
            Este invitado ya registró su ingreso.
          </p>

        </div>

      `;

      return;

    }


    // ==========================================
    // REGISTRO EXITOSO
    // ==========================================

    if (
      datos.mensaje === "REGISTRADO"
    ) {

      document.getElementById("resultado").innerHTML = `

        <div class="exito">

          <h2>
            ✅ REGISTRO EXITOSO
          </h2>

          <h3>
            ${datos.nombre}
            ${datos.apellido}
          </h3>

          <p>
            <b>Cargo:</b>
            ${datos.cargo}
          </p>

          <p>
            <b>Empresa:</b>
            ${datos.empresa}
          </p>

          <p>
            <b>Ingreso registrado:</b>
            ${formatearFecha(datos.horaIngreso)}
          </p>

        </div>

      `;

    }

  };


  // ================================================
  // CREAR SCRIPT JSONP
  // ================================================

  const script =
    document.createElement("script");


  script.id =
    nombreCallback;


  script.src =
    URL_APPS_SCRIPT +
    "?id=" +
    encodeURIComponent(id) +
    "&callback=" +
    nombreCallback;


  document.body.appendChild(script);


  // ================================================
  // CONTROL DE TIEMPO DE ESPERA
  // ================================================

  setTimeout(function() {

    if (
      typeof window[nombreCallback] === "function"
    ) {

      document.getElementById("resultado").innerHTML = `

        <div class="error">

          <h2>
            ❌ Sin respuesta
          </h2>

          <p>
            Apps Script no respondió.
          </p>

        </div>

      `;

      try {
        delete window[nombreCallback];
      } catch (e) {
        window[nombreCallback] = undefined;
      }

    }

  }, 10000);

}


// ==================================================
// FORMATEAR FECHA
// ==================================================

function formatearFecha(fecha) {

  if (!fecha) {
    return "";
  }


  const fechaObjeto =
    new Date(fecha);


  if (isNaN(fechaObjeto)) {
    return fecha;
  }


  return fechaObjeto.toLocaleString(
    "es-PE",
    {
      dateStyle: "short",
      timeStyle: "medium"
    }
  );

}


// ==================================================
// REINICIAR ESCÁNER
// ==================================================

function reiniciarEscaner() {

  document.getElementById("resultado").innerHTML =
    "📷 Preparando cámara...";


  iniciarEscaner();

}


// ==================================================
// INICIAR AUTOMÁTICAMENTE
// ==================================================

window.onload = function() {

  iniciarEscaner();

};

</script>

</body>

</html>
